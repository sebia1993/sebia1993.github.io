<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc"><title id="title">Ethernet MAC Table Lab topology</title><desc id="desc">PC1 .10 connects to SW1 eth0, PC2 .20 to eth1, PC3 .30 to eth2. All use 192.168.10.0/24 without gateway.</desc><rect width="1100" height="360" rx="16" fill="#0a1726"/><g stroke="#58b8ff" stroke-width="3" fill="none"><path d="M270 170H420"/><path d="M550 265V218"/><path d="M680 170H830"/></g><g fill="#102236" stroke="#31556e" stroke-width="2"><rect x="50" y="115" width="220" height="105" rx="12"/><rect x="420" y="112" width="260" height="106" rx="12"/><rect x="830" y="115" width="220" height="105" rx="12"/><rect x="440" y="265" width="220" height="80" rx="12"/></g><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#eef6ff"><text x="550" y="42" font-size="21">같은 Subnet · 192.168.10.0/24 · Gateway 없음</text><text x="160" y="147" font-size="23">PC1</text><text x="160" y="176" font-size="16">192.168.10.10</text><text x="160" y="200" font-size="13" fill="#9fb2c9">00:50:79:66:68:00</text><text x="550" y="147" font-size="23">SW1 · Linux Bridge</text><text x="550" y="177" font-size="16" fill="#7ee0c2">br0 · Source MAC Learning</text><text x="550" y="200" font-size="13" fill="#9fb2c9">FDB 조회 · 포트별 학습 · Aging</text><text x="940" y="147" font-size="23">PC3</text><text x="940" y="176" font-size="16">192.168.10.30</text><text x="940" y="200" font-size="13" fill="#9fb2c9">00:50:79:66:68:02</text><text x="550" y="292" font-size="20">PC2 · 192.168.10.20</text><text x="550" y="320" font-size="13" fill="#9fb2c9">00:50:79:66:68:01</text><text x="342" y="153" font-size="14" fill="#7ee0c2">eth0 / port 1</text><text x="755" y="153" font-size="14" fill="#7ee0c2">eth2 / port 3</text><text x="651" y="246" font-size="14" fill="#7ee0c2">eth1 / port 2</text></g></svg>