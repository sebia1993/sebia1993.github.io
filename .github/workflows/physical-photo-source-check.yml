name: Physical photo source check
on:
  push:
    branches: [work/physical-cross-section-photos-20261008]
    paths: [.github/workflows/physical-photo-source-check.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve public reference and licensed photo originals
        run: |
          mkdir -p test-results/photo-sources
          python3 - <<'PY'
          import urllib.request, pathlib, hashlib, json
          root=pathlib.Path('test-results/photo-sources')
          urls={
            'cat5e-cross-section-original.jpg':('https://upload.wikimedia.org/wikipedia/commons/4/45/Cross_section_of_a_Cat5e_patch_cable.jpg','9cf7f2c45afc35aa8e832f8659c1f6ed229cf466'),
            'cat6-cross-section-original.jpg':('https://upload.wikimedia.org/wikipedia/commons/4/41/Cross_section_of_a_Cat6_patch_cable.jpg','05fd9cc30d0579635ea05848b70e1c2217e08587'),
            'naver-reference.html':('https://m.blog.naver.com/PostView.naver?blogId=bi-zdoc&logNo=222231800588&proxyReferer=&noTrackingCode=true',None)
          }
          result=[]
          for name,(url,expected) in urls.items():
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Network-Learning-PhotoReview/1.0 (https://sebia1993.github.io/)'})
              with urllib.request.urlopen(req,timeout=35) as r:
                data=r.read(); status=r.status; mime=r.headers.get('Content-Type'); final=r.url
              if expected:
                assert hashlib.sha1(data).hexdigest()==expected,(name,'source hash mismatch')
              (root/name).write_bytes(data)
              result.append(dict(file=name,url=url,final=final,status=status,mime=mime,bytes=len(data),sha1=hashlib.sha1(data).hexdigest()))
            except Exception as e:
              result.append(dict(file=name,url=url,error=str(e)))
          (root/'source-fetch.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: physical-photo-sources
          path: test-results/photo-sources/
          retention-days: 3
