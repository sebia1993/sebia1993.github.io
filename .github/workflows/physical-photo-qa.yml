name: Physical cross-section photo QA
on:
  push:
    branches: [work/physical-cross-section-photos-20261008]
    paths: [.github/workflows/physical-photo-qa.yml]
permissions:
  contents: write
concurrency:
  group: physical-cross-section-photo-qa
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_CHECK: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Prepare real photographs and scoped content patch
        if: env.PUBLIC_CHECK == 'false'
        run: |
          python3 -m pip install 'Pillow>=10,<13'
          python3 tools/apply-physical-cross-section-photos.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: python3 tests/check_site.py
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install Korean screenshot font
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Photo rendering and accessibility regression
        run: node tests/physical-network-photos-browser.mjs
      - name: Existing physical concept and simulator regression
        if: env.PUBLIC_CHECK == 'false'
        run: node tests/physical-network-browser.mjs
      - name: Preserve place-based comparison regression
        run: node tests/physical-network-places-browser.mjs
      - name: Verify actual public bytes, images and browser operations
        if: env.PUBLIC_CHECK == 'true'
        env:
          BASE_URL: https://sebia1993.github.io
        run: node tests/physical-network-photos-browser.mjs
      - name: Commit verified content to work branch only
        if: env.PUBLIC_CHECK == 'false'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/physical-network.html labs/physical-network-photos.css labs/images/cat5e-cross-section.jpg labs/images/cat6-cross-section.jpg labs/images/cat5e-cross-section-original.jpg labs/images/cat6-cross-section-original.jpg docs/physical-network-photo-sources.json docs/physical-network-cross-section-photos.md
          git commit -m 'docs: add actual Cat5e and Cat6 cross-section photographs with attribution'
          git push origin HEAD:work/physical-cross-section-photos-20261008
      - name: Record content blob IDs
        run: |
          mkdir -p test-results/physical-photos
          git rev-parse HEAD > test-results/physical-photos/commit.txt
          git ls-tree HEAD -- labs/physical-network.html labs/physical-network-photos.css labs/images/cat5e-cross-section.jpg labs/images/cat6-cross-section.jpg labs/images/cat5e-cross-section-original.jpg labs/images/cat6-cross-section-original.jpg docs/physical-network-photo-sources.json docs/physical-network-cross-section-photos.md tests/physical-network-photos.test.mjs tests/physical-network-photos-browser.mjs > test-results/physical-photos/blobs.txt
      - name: Archive exact candidate for visual review
        if: always()
        run: |
          mkdir -p test-results
          tar --exclude=./.git --exclude=./node_modules --exclude=./test-results -czf test-results/physical-photo-site.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physical-photo-qa-${{ github.run_id }}
          path: |
            test-results/physical-photos/
            test-results/physical-photo-site.tar.gz
          retention-days: 3
