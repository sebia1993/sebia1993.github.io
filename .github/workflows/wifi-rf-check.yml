name: Wi-Fi RF page checks
on:
  push:
    branches: [main]
    paths:
      - 'labs/wifi-rf.html'
      - 'labs/wifi-rf-simulator.html'
      - 'tests/wifi-rf-final.mjs'
      - 'package.json'
      - '.github/workflows/wifi-rf-check.yml'
  pull_request:
    paths:
      - 'labs/wifi-rf.html'
      - 'labs/wifi-rf-simulator.html'
      - 'tests/wifi-rf-final.mjs'
      - 'package.json'
      - '.github/workflows/wifi-rf-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node tests/wifi-rf-final.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wifi-rf-browser-evidence
          path: test-results/
          retention-days: 7
