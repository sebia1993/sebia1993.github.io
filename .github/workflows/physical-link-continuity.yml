name: Physical link continuity QA
on:
  push:
    branches: [work/physical-link-continuity-20261008]
    paths: [.github/workflows/physical-link-continuity.yml]
permissions:
  contents: read
concurrency:
  group: physical-link-continuity
  cancel-in-progress: false
jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: python3 tests/check_site.py
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Verify public file identity and all seven responsive connection states
        env:
          BASE_URL: https://sebia1993.github.io
        run: node tests/physical-network-lines-browser.mjs
      - name: Verify all twelve exercises on the public simulator
        env:
          BASE_URL: https://sebia1993.github.io
        run: node tests/physical-network-sync-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physical-line-public-${{ github.run_id }}
          path: test-results/
          retention-days: 3
