name: Physical link continuity QA
on:
  push:
    branches: [work/physical-link-continuity-20261008]
    paths: [.github/workflows/physical-link-continuity.yml]
permissions:
  contents: write
concurrency:
  group: physical-link-continuity
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Reproduce baseline CSS-to-SVG gaps
        env:
          BASELINE: '1'
        run: node tests/physical-network-lines-browser.mjs
      - name: Apply guarded simulator-only fix
        run: |
          python3 tools/apply-physical-link-continuity.py
          git diff --check
          git diff --exit-code -- labs/physical-network.html labs/physical-network.css labs/physical-network-topology.js labs/physical-network-model.js labs/physical-network-lessons.js labs/physical-network-simulator.js labs/physical-network-simulator.css roadmap.html
      - run: pnpm test
      - run: python3 tests/check_site.py
      - name: Existing compactness, answer and focus regression
        run: node tests/physical-network-regression.mjs
      - name: Seven viewport continuity and failure-state checks
        run: node tests/physical-network-lines-browser.mjs
      - name: Existing physical-state and accessibility regression
        run: |
          node tests/physical-network-browser.mjs
          node tests/physical-network-accessibility.mjs
      - name: Preserve all twelve exercises and material comparisons
        run: |
          node tests/physical-network-sync-browser.mjs
          node tests/physical-network-material-review-browser.mjs
      - name: Commit verified candidate to work branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/physical-network-simulator.html labs/physical-network-simulator-links.js labs/physical-network-simulator-links.css
          git commit -m 'fix: connect physical simulator cables continuously to device anchors'
          git push origin HEAD:work/physical-link-continuity-20261008
          git rev-parse HEAD > test-results/line-continuity/commit.txt
          git ls-tree HEAD -- labs/physical-network-simulator.html labs/physical-network-simulator-links.js labs/physical-network-simulator-links.css tests/physical-network-line-geometry.mjs tests/physical-network-lines.test.mjs tests/physical-network-lines-browser.mjs docs/physical-network-line-continuity.md > test-results/line-continuity/blobs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physical-line-continuity-${{ github.run_id }}
          path: test-results/
          retention-days: 3
