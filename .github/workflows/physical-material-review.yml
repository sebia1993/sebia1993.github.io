name: Physical simulator material review
on:
  push:
    branches: [work/physical-simulator-material-review-20261008]
    paths: [.github/workflows/physical-material-review.yml]
permissions:
  contents: write
concurrency:
  group: physical-simulator-material-review
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_CHECK: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Record before-change coverage and apply guarded patch
        if: env.PUBLIC_CHECK == 'false'
        shell: bash
        run: |
          mkdir -p test-results/material-review
          if node --test tests/physical-network-material-review.test.mjs > test-results/material-review/before.txt 2>&1; then
            echo 'Baseline unexpectedly already covers the requested refinements'; exit 1
          fi
          python3 tools/refresh_physical_simulator.py
          git diff --check
          git diff --name-only > test-results/material-review/changed-before-commit.txt
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={'labs/physical-network-lessons.js','labs/physical-network-simulator.js','labs/physical-network-simulator.css','labs/physical-network-simulator.html'}
          assert changed==expected,changed
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: python3 tests/check_site.py
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: New material observation and accessibility checks
        run: node tests/physical-network-material-review-browser.mjs
      - name: Existing physical-state and completion regression
        if: env.PUBLIC_CHECK == 'false'
        run: |
          node tests/physical-network-browser.mjs
          node tests/physical-network-accessibility.mjs
          node tests/physical-network-regression.mjs
      - name: Preserve all existing concept-synced exercises
        run: node tests/physical-network-sync-browser.mjs
      - name: ARP reference and approved IP template comparison
        if: env.PUBLIC_CHECK == 'false'
        run: node tests/ip-network-sim.mjs
      - name: Public byte identity and real deployed interactions
        if: env.PUBLIC_CHECK == 'true'
        env:
          BASE_URL: https://sebia1993.github.io
        run: |
          node tests/physical-network-material-review-browser.mjs
          node tests/physical-network-sync-browser.mjs
      - name: Commit verified simulator changes to work branch only
        if: env.PUBLIC_CHECK == 'false'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/physical-network-lessons.js labs/physical-network-simulator.js labs/physical-network-simulator.css labs/physical-network-simulator.html
          git commit -m 'feat: refine physical simulator observations with latest concept materials'
          git push origin HEAD:work/physical-simulator-material-review-20261008
      - name: Record exact candidate blob IDs
        run: |
          mkdir -p test-results/material-review
          git rev-parse HEAD > test-results/material-review/commit.txt
          git ls-tree HEAD -- labs/physical-network-lessons.js labs/physical-network-simulator.js labs/physical-network-simulator.css labs/physical-network-simulator.html tests/physical-network-material-review.test.mjs tests/physical-network-material-review-browser.mjs docs/physical-network-material-review.md > test-results/material-review/blobs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-review-${{ github.run_id }}
          path: test-results/
          retention-days: 3
