name: VRF public Pages QA
on:
  push:
    branches: [main]
    paths:
      - 'tests/vrf-public.mjs'
      - '.github/workflows/vrf-public-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node tests/vrf-public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vrf-public-browser-evidence
          path: test-results/vrf-public/
          retention-days: 7
