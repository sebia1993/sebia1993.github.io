name: BGP public Pages QA
on:
  push:
    branches: [main]
    paths:
      - 'labs/bgp.html'
      - 'labs/bgp-simulator.html'
      - 'labs/bgp-model.js'
      - 'labs/network-simulator-*.js'
      - 'labs/network-simulator-*.css'
      - 'tests/roadmap-simulators.mjs'
      - 'roadmap.html'
      - 'learning-data.json'
      - 'tests/bgp-public.mjs'
      - '.github/workflows/bgp-public-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node tests/roadmap-simulators.mjs
        env:
          TOPIC: bgp
          BASE_URL: https://sebia1993.github.io
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bgp-public-browser-evidence
          path: test-results/roadmap-simulators/
          retention-days: 7
